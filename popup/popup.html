<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>书签管家</title>
  <!-- CSS 内联：消除渲染阻塞的额外请求，弹窗首帧无外部依赖 -->
  <style>
:root {
  --bg: #ffffff;
  --fg: #1f2328;
  --muted: #6b7280;
  --line: #e5e7eb;
  --accent: #4f6ef7;
  --accent-soft: #eef1fe;
  --hover: #f3f4f6;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1e1f24;
    --fg: #e6e6ea;
    --muted: #9ca3af;
    --line: #33353c;
    --accent: #7b93ff;
    --accent-soft: #2a2f45;
    --hover: #2a2c33;
  }
}

* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  width: 380px;
  margin: 0;
  font: 14px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  color: var(--fg);
  background: var(--bg);
}

.topbar { padding: 12px 12px 8px; }
#search {
  width: 100%;
  padding: 8px 12px;
  font-size: 14px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--bg);
  color: var(--fg);
  outline: none;
}
#search:focus { border-color: var(--accent); }

.section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 14px 2px;
}
.section-title { font-size: 12px; color: var(--muted); font-weight: 600; }
.mini-btn {
  border: none;
  background: none;
  color: var(--accent);
  font-size: 12px;
  cursor: pointer;
  padding: 2px 4px;
  border-radius: 4px;
}
.mini-btn:hover { background: var(--accent-soft); }
.mini-btn.active { background: var(--accent); color: #fff; }

#quick-section { min-height: 118px; }

.quick-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 4px;
  padding: 6px 10px 10px;
}
.quick-item {
  position: relative;
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: 10px 4px 8px;
  border-radius: 10px;
  cursor: pointer;
  text-align: center;
}
.quick-item:hover { background: var(--hover); }
.quick-item img { width: 28px; height: 28px; border-radius: 6px; }
.quick-item .q-title {
  font-size: 11px;
  color: var(--fg);
  width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.quick-item .q-del {
  position: absolute;
  top: 2px;
  right: 2px;
  width: 18px;
  height: 18px;
  line-height: 16px;
  border: none;
  border-radius: 50%;
  background: #e5484d;
  color: #fff;
  font-size: 12px;
  cursor: pointer;
  display: none;
  padding: 0;
}
.editing .quick-item .q-del { display: block; }

.quick-item .q-rename {
  width: 100%;
  box-sizing: border-box;
  font-size: 11px;
  text-align: center;
  border: 1px solid var(--accent);
  border-radius: 4px;
  background: var(--bg);
  color: var(--fg);
  padding: 1px 2px;
  outline: none;
}

.quick-item.dragging { opacity: 0.4; }
.quick-item.drop-target {
  background: var(--accent-soft);
  outline: 2px dashed var(--accent);
  outline-offset: -2px;
}

/* 分组格子：2×2 favicon 拼贴 */
.collage {
  width: 30px;
  height: 30px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-auto-rows: 1fr;
  gap: 2px;
  padding: 3px;
  box-sizing: border-box;
  background: var(--accent-soft);
  border-radius: 8px;
}
.collage img {
  width: 100%;
  height: 100%;
  border-radius: 2px;
  object-fit: cover;
}

/* 分组视图 */
.group-head {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 14px 2px;
}
.group-name-input {
  flex: 1;
  min-width: 0;
  border: 1px solid transparent;
  border-radius: 6px;
  background: none;
  color: var(--fg);
  font-size: 13px;
  font-weight: 600;
  padding: 3px 6px;
  outline: none;
}
.group-name-input:hover { border-color: var(--line); }
.group-name-input:focus { border-color: var(--accent); background: var(--bg); }

.result-list {
  list-style: none;
  margin: 0;
  padding: 0 6px;
  max-height: 360px;
  overflow-y: auto;
}
.result-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 8px;
  border-radius: 8px;
  cursor: pointer;
}
.result-item:hover, .result-item.selected { background: var(--hover); }
.result-item img { width: 18px; height: 18px; flex: none; border-radius: 4px; }
.result-item .r-text { min-width: 0; }
.result-item .r-title {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.result-item .r-url {
  font-size: 11px;
  color: var(--muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.empty {
  color: var(--muted);
  font-size: 12px;
  text-align: center;
  padding: 16px 12px;
  margin: 0;
}

.bottombar {
  display: flex;
  gap: 8px;
  padding: 10px 12px;
  border-top: 1px solid var(--line);
}
.footer-btn {
  flex: 1;
  padding: 7px 0;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--bg);
  color: var(--fg);
  font-size: 13px;
  cursor: pointer;
}
.footer-btn:hover { background: var(--hover); }
.footer-btn.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}
.footer-btn.primary:hover { filter: brightness(1.08); }

.devinfo {
  font: 10px/1.4 ui-monospace, Menlo, monospace;
  color: var(--muted);
  padding: 0 12px 6px;
  white-space: pre-wrap;
  user-select: text;
}
  </style>
</head>
<body>
  <header class="topbar">
    <input id="search" type="search" placeholder="搜索全部书签…" autocomplete="off" autofocus />
  </header>

  <section id="results-section" hidden>
    <ul id="results" class="result-list"></ul>
    <p id="no-results" class="empty" hidden>没有匹配的书签</p>
  </section>

  <section id="quick-section">
    <div class="section-head">
      <span class="section-title">快捷书签</span>
      <span class="section-actions">
        <button id="add-current" class="mini-btn" title="把当前页面加入快捷书签">＋当前页</button>
        <button id="toggle-edit" class="mini-btn" title="编辑快捷书签">编辑</button>
      </span>
    </div>
    <div id="quick-grid" class="quick-grid"></div>
    <p id="quick-empty" class="empty" hidden>还没有快捷书签，点「＋当前页」把常用页面固定在这里</p>
  </section>

  <section id="group-section" hidden>
    <div class="group-head">
      <button id="group-back" class="mini-btn">← 返回</button>
      <input id="group-name" class="group-name-input" maxlength="12" title="点击修改分组名" />
      <button id="toggle-edit2" class="mini-btn" title="编辑分组成员">编辑</button>
    </div>
    <div id="group-grid" class="quick-grid"></div>
    <p class="empty">编辑模式下点 × 可把页面移出分组</p>
  </section>

  <footer class="bottombar">
    <button id="open-manager" class="footer-btn primary">🗂 整理书签</button>
    <button id="open-options" class="footer-btn" title="设置（API Key 等）">⚙️ 设置</button>
  </footer>
  <!-- 开发版诊断行：未打包扩展才显示 -->
  <div id="devinfo" class="devinfo" hidden></div>

  <script type="module" src="popup.js"></script>
</body>
</html>
